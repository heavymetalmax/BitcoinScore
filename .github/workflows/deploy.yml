name: Deploy Static Site

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Add no-cache headers to data files
        run: |
          cat >> web/index.html << 'HEADERS'
          <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
          <meta http-equiv="Pragma" content="no-cache">
          <meta http-equiv="Expires" content="0">
          HEADERS

      - name: Download fresh wallpapers
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          pip install requests --quiet
          python - <<'EOF'
          import json, sys, os
          sys.path.insert(0, '.')
          from scraper.wallpaper import update_wallpapers
          try:
              with open('web/data.json') as f:
                  score = json.load(f).get('final_score', 50)
          except Exception:
              score = 50
          update_wallpapers(final_score=score, web_dir='web')
          EOF
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
