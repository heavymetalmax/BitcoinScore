name: Update BTC Data

on:
  schedule:
    - cron: '0 8 * * *'   # fallback — runs only if home server did not push
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
  CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.gpt_api }}

jobs:
  update:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.51.0-noble
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Check if data already fresh
        id: freshness
        run: |
          TS=$(python3 -c "import json; d=json.load(open('data/data.json')); print(d.get('timestamp','')[:10])")
          TODAY=$(date -u +%Y-%m-%d)
          echo "Data timestamp: $TS  Today: $TODAY"
          if [ "$TS" = "$TODAY" ]; then
            echo "fresh=true" >> $GITHUB_OUTPUT
            echo "Home server already pushed today — skipping scraper"
          else
            echo "fresh=false" >> $GITHUB_OUTPUT
            echo "Data is stale — running scraper as fallback"
          fi

      - name: Install Python dependencies
        if: steps.freshness.outputs.fresh == 'false'
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        if: steps.freshness.outputs.fresh == 'false'
        run: python -m scraper.scraper

      - name: Retry stale metrics
        if: steps.freshness.outputs.fresh == 'false'
        run: python tools/retry_stale_metrics.py || true

      - name: Build unified history
        if: steps.freshness.outputs.fresh == 'false'
        run: python tools/build_unified_history.py

      - name: Update signal ledger
        if: steps.freshness.outputs.fresh == 'false'
        run: python tools/signal_ledger.py || true

      - name: Compute historical bucket returns
        if: steps.freshness.outputs.fresh == 'false'
        run: python3 tools/bucket_returns.py

      - name: Run drift monitor
        if: steps.freshness.outputs.fresh == 'false'
        run: python tools/drift_monitor.py || true

      - name: Generate ICS calendar feed
        if: steps.freshness.outputs.fresh == 'false'
        run: python tools/generate_ics.py

      - name: Generate sparklines for VS History charts
        if: steps.freshness.outputs.fresh == 'false'
        run: python tools/generate_sparklines.py

      - name: Copy data files to web/
        if: steps.freshness.outputs.fresh == 'false'
        run: |
          cp data/data.json web/data.json
          [ -f data/data_exp.json ] && cp data/data_exp.json web/data_exp.json || true
          [ -f data/bucket_returns.json ] && cp data/bucket_returns.json web/bucket_returns.json || true
          python3 tools/sync_web_scores.py

      - name: Commit and push data
        if: steps.freshness.outputs.fresh == 'false'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add -u
          git commit -m "chore: update data.json [skip ci]" || echo "No changes to commit"
          git pull --rebase --strategy-option=theirs origin main
          git push

      - name: Upload Pages artifact
        if: steps.freshness.outputs.fresh == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.fresh == 'false'
        uses: actions/deploy-pages@v4
