name: Update BTC Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  update:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.51.0-noble
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python -m scraper.scraper

      - name: Copy data.json next to index.html
        run: cp data/data.json web/data.json

      - name: Commit and push data
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add data/data.json web/data.json
          git commit -m "chore: update data.json [skip ci]" || echo "No changes to commit"
          git pull --rebase --strategy-option=theirs origin main
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
